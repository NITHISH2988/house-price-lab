[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="house-price-lab"
version="0.2.0"
description="Reproducible regression experiments with leakage-safe preprocessing"
readme="README.md"
requires-python=">=3.10"
license={file="LICENSE"}
dependencies=["numpy>=1.24","pandas>=2.0","scikit-learn>=1.3","joblib>=1.3","fastapi>=0.110","uvicorn>=0.27"]
[project.optional-dependencies]
dev=["pytest>=8","httpx>=0.27","ruff>=0.17.3"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
